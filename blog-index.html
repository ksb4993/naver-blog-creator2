<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤖 AI 네이버 블로그 글 생성기 (텍스트 전용)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: #FAF5F0;
      color: #3E2723;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 300px;
      background: linear-gradient(180deg, #F5E6D3 0%, #FAF5F0 100%);
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #3E2723;
      text-align: center;
      margin-bottom: 40px;
      font-size: 3em;
      font-weight: 800;
      text-shadow: none;
      letter-spacing: -1px;
    }

    .version-badge {
      background: #C77B5D;
      color: white;
      padding: 8px 20px;
      border-radius: 25px;
      font-size: 0.35em;
      font-weight: 600;
      vertical-align: middle;
      font-family: 'Noto Sans KR', sans-serif;
      letter-spacing: 0;
    }

    .section {
      background: white;
      padding: 40px;
      border-radius: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 20px rgba(62, 39, 35, 0.08);
      border: none;
    }

    .section h2 {
      font-family: 'Playfair Display', serif;
      color: #3E2723;
      margin-bottom: 20px;
      font-size: 2em;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    textarea, input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #E8DED5;
      border-radius: 12px;
      font-size: 15px;
      margin-bottom: 12px;
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      transition: all 0.3s;
      background: #FDFBF9;
    }

    textarea:focus, input:focus {
      outline: none;
      border-color: #C77B5D;
      background: white;
      box-shadow: 0 0 0 3px rgba(199, 123, 93, 0.1);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      background: #C77B5D;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-right: 10px;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(199, 123, 93, 0.25);
      font-family: 'Noto Sans KR', sans-serif;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(199, 123, 93, 0.35);
      background: #B56A4D;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .result-item {
      background: #FDFBF9;
      padding: 30px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 2px solid #F0E8E0;
    }

    .result-item h3 {
      font-family: 'Playfair Display', serif;
      color: #3E2723;
      margin-bottom: 15px;
      font-weight: 700;
    }

    .result-body {
      line-height: 1.8;
      white-space: pre-wrap;
      color: #5D4E47;
    }

    .loading {
      text-align: center;
      color: #C77B5D;
      font-weight: 600;
      padding: 30px;
      font-size: 1.2em;
    }

    .info-box {
      background: #FFF9F5;
      border-left: 4px solid #C77B5D;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      color: #5D4E47;
    }
  </style>
</head>
<body>
  <!-- 헤더 -->
  <header style="max-width:1280px;margin:0 auto;padding:24px 40px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px">
    <div style="display:flex;align-items:center;gap:32px;flex-wrap:wrap">
      <h1 style="margin:0;font-size:2em">
        블로그 글 생성기
        <span class="version-badge">텍스트 전용</span>
      </h1>
    </div>
  </header>

  <!-- 히어로 섹션 -->
  <section style="max-width:1280px;margin:0 auto;padding:40px;display:flex;flex-wrap:wrap;gap:32px;align-items:stretch">
    <!-- 왼쪽: 텍스트 -->
    <div style="flex:1 1 400px;display:flex;flex-direction:column;justify-content:center;gap:24px">
      <div style="font-size:13px;font-weight:700;letter-spacing:0.14em;color:#C77B5D">AI 네이버 블로그 글 생성기</div>
      <h2 style="margin:0;font-family:'Playfair Display',serif;font-size:clamp(40px,5vw,64px);line-height:1.2;font-weight:800;letter-spacing:-0.02em;color:#3E2723">
        좋은 글도,<br>
        쉽게.
      </h2>
      <p style="margin:0;font-size:17px;line-height:1.7;max-width:420px;color:#5D4E47">
        주제만 적으면 네이버 블로그에 맞는 제목, 본문, 해시태그까지 한 번에. 초안은 AI가, 마무리는 내 목소리로.
      </p>
    </div>

    <!-- 오른쪽: 입력 폼 카드 -->
    <div style="flex:1 1 500px;min-width:0">
      <div style="background:white;border-radius:24px;padding:32px;box-shadow:0 24px 40px rgba(62,39,35,0.15);display:flex;flex-direction:column;gap:20px">
        <!-- 스타일 분석 -->
        <div style="display:flex;flex-direction:column;gap:12px">
          <label style="font-size:12px;font-weight:700;letter-spacing:0.06em;color:#3E2723">참고 글 붙여넣기</label>
          <textarea id="referencePosts" placeholder="내 블로그 글 2~3개를 붙여넣으세요..." style="min-height:100px"></textarea>
          <button onclick="analyzeStyle()">스타일 분석</button>
        </div>

        <div id="styleResult"></div>

        <!-- 가게 정보 -->
        <div style="display:flex;flex-direction:column;gap:12px;border-top:2px dashed #E8DED5;padding-top:20px">
          <span style="font-size:12px;font-weight:700;letter-spacing:0.06em;color:#3E2723">가게 정보</span>
          <input type="text" id="storeName" placeholder="가게 이름 (예: 강남 맛집 카페)">
          <input type="text" id="storeType" placeholder="업종 (예: 카페, 식당)">
          <input type="text" id="storeLocation" placeholder="지역 (예: 강남역)">
          <input type="text" id="storeHighlights" placeholder="강조할 점">
        </div>

        <!-- 키워드 -->
        <div style="display:flex;flex-direction:column;gap:12px;border-top:2px dashed #E8DED5;padding-top:20px">
          <label style="font-size:12px;font-weight:700;letter-spacing:0.06em;color:#3E2723">키워드 (한 줄에 하나씩)</label>
          <textarea id="keywords" placeholder="강남 맛집&#10;데이트 카페" style="min-height:80px"></textarea>
          <button onclick="generatePosts()" style="font-size:15px;padding:16px 32px">글 생성하기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 기능 스트립 -->
  <section style="background:#C5B5D5;margin-top:40px">
    <div style="max-width:1280px;margin:0 auto;padding:28px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px">
      <div style="display:flex;align-items:center;gap:14px">
        <span style="flex:none;width:48px;height:48px;border-radius:50%;border:2px solid #3E2723;display:flex;align-items:center;justify-content:center;font-weight:700">1</span>
        <span style="font-size:13px;font-weight:700;line-height:1.5">스타일 분석으로<br>내 말투 파악</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <span style="flex:none;width:48px;height:48px;border-radius:50%;border:2px solid #3E2723;display:flex;align-items:center;justify-content:center;font-weight:700">2</span>
        <span style="font-size:13px;font-weight:700;line-height:1.5">가게 정보와<br>키워드 입력</span>
      </div>
      <div style="display:flex;Align-items:center;gap:14px">
        <span style="flex:none;width:48px;height:48px;border-radius:50%;border:2px solid #3E2723;display:flex;align-items:center;justify-content:center;font-weight:700">3</span>
        <span style="font-size:13px;font-weight:700;line-height:1.5">AI가 제목, 본문<br>해시태그 생성</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <span style="flex:none;width:48px;height:48px;border-radius:50%;border:2px solid #3E2723;display:flex;align-items:center;justify-content:center;font-weight:700">4</span>
        <span style="font-size:13px;font-weight:700;line-height:1.5">복사해서 바로<br>블로그에 붙여넣기</span>
      </div>
    </div>
  </section>

  <!-- 결과 섹션 -->
  <section style="max-width:1280px;margin:40px auto;padding:40px">
    <h2 style="margin:0 0 30px 0;font-family:'Playfair Display',serif;font-size:2.5em;font-weight:800;text-align:center;color:#3E2723">생성 결과</h2>
    <div id="results"></div>
  </section>

  <script>
    // ========================================
    // 📊 전역 변수
    // ========================================

    let analyzedStyle = null;
    let storeInfo = null;
    let generatedPosts = [];

    // ========================================
    // 📝 스타일 분석 함수
    // ========================================
    async function analyzeStyle() {
      // TODO: AI한테 물어보기!
      //
      // 질문: "JavaScript fetch()로 POST 요청 보내는 방법 알려줘.
      //       엔드포인트는 /api/analyze-style이고,
      //       body에 { referencePosts: '글 내용' } JSON을 보내야 해."

      const referencePosts = document.getElementById('referencePosts').value;

      if (!referencePosts.trim()) {
        alert('참고 글을 입력해주세요!');
        return;
      }

      const resultDiv = document.getElementById('styleResult');
      resultDiv.innerHTML = '<div class="loading">분석 중...</div>';

      try {
        console.log('스타일 분석 요청 시작...');

        const response = await fetch('/api/analyze-style', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ referencePosts })
        });

        console.log('서버 응답 상태:', response.status);

        if (!response.ok) {
          const errorText = await response.text();
          console.error('서버 에러:', errorText);
          throw new Error(`서버 응답 실패 (${response.status}): ${errorText}`);
        }

        const responseText = await response.text();
        console.log('서버 응답:', responseText);

        analyzedStyle = JSON.parse(responseText);
        console.log('분석 결과:', analyzedStyle);

        // localStorage에 저장
        localStorage.setItem('analyzedStyle', JSON.stringify(analyzedStyle));

        // 화면에 결과 표시 (수정 가능한 입력 필드로)
        resultDiv.innerHTML = `
          <div class="result-item">
            <h3 style="text-align: center; margin-bottom: 20px; font-size: 1.4em;">스타일 분석 완료!</h3>

            <div style="margin-bottom: 15px;">
              <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">말투</label>
              <input type="text" id="styleTone" value="${analyzedStyle.tone}" placeholder="예: 해요체 - '~해요', '~이에요' 사용">
            </div>

            <div style="margin-bottom: 15px;">
              <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">소제목</label>
              <input type="text" id="styleSubheadings" value="${analyzedStyle.subheadings}" placeholder="예: 3~4개 사용, 이모지 배치">
            </div>

            <div style="margin-bottom: 15px;">
              <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">문단 길이</label>
              <input type="text" id="styleParagraphLength" value="${analyzedStyle.paragraphLength}" placeholder="예: 짧음 - 문단당 2~3문장">
            </div>

            <div style="margin-bottom: 15px;">
              <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">해시태그 개수</label>
              <input type="text" id="styleHashtagCount" value="${analyzedStyle.hashtagCount}" placeholder="예: 5~7개">
            </div>

            <div style="margin-bottom: 15px;">
              <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">도입부 패턴</label>
              <textarea id="styleIntroFormula" style="min-height: 80px;" placeholder="예: 질문으로 시작 - '혹시 ~하신 적 있나요?'">${analyzedStyle.introFormula}</textarea>
            </div>

            <div style="margin-bottom: 15px;">
              <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">마무리 패턴</label>
              <textarea id="styleClosingFormula" style="min-height: 80px;" placeholder="예: 방문 유도 - '한번 방문해보세요!'">${analyzedStyle.closingFormula}</textarea>
            </div>
          </div>
        `;

        // 입력 필드에 자동 저장 이벤트 리스너 추가
        attachStyleInputListeners();

      } catch (error) {
        console.error('스타일 분석 에러:', error);
        resultDiv.innerHTML = `
          <div style="background: #ffebee; padding: 20px; border-radius: 10px; border-left: 4px solid #f44336;">
            <h4 style="color: #d32f2f; margin-bottom: 10px;">에러 발생</h4>
            <p><strong>메시지:</strong> ${error.message}</p>
            <p style="font-size: 0.9em; margin-top: 10px;">
              브라우저 개발자 도구(F12)의 Console 탭에서 자세한 에러를 확인하세요.
            </p>
          </div>
        `;
      }
    }

    // ========================================
    // ✨ 블로그 글 생성 함수
    // ========================================
    async function generatePosts() {
      // TODO: AI한테 물어보기!
      //
      // 질문: "여러 키워드를 순차적으로 처리하면서
      //       각각 API 호출하고 결과를 배열에 모으는 방법 알려줘.
      //       async/await와 for 루프를 사용해야 해."

      if (!analyzedStyle) {
        alert('먼저 스타일 분석을 해주세요!');
        return;
      }

      storeInfo = {
        name: document.getElementById('storeName').value,
        type: document.getElementById('storeType').value,
        location: document.getElementById('storeLocation').value,
        highlights: document.getElementById('storeHighlights').value
      };

      if (!storeInfo.name || !storeInfo.type) {
        alert('가게 이름과 업종은 필수입니다!');
        return;
      }

      const keywordsText = document.getElementById('keywords').value;
      const keywords = keywordsText.split('\n').filter(k => k.trim());

      if (keywords.length === 0) {
        alert('키워드를 입력해주세요!');
        return;
      }

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="loading">✨ 글 생성 중...</div>';

      generatedPosts = [];

      try {
        for (const keyword of keywords) {
          resultsDiv.innerHTML = `<div class="loading">"${keyword}" 글 생성 중...</div>`;

          const response = await fetch('/api/generate-post', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              keyword,
              style: analyzedStyle,
              storeInfo
            })
          });

          if (!response.ok) {
            throw new Error(`"${keyword}" 생성 실패`);
          }

          const post = await response.json();
          generatedPosts.push({ keyword, ...post });
        }

        // localStorage에 저장
        localStorage.setItem('generatedPosts', JSON.stringify(generatedPosts));

        displayResults();

      } catch (error) {
        resultsDiv.innerHTML = `<div style="color: red;">❌ 에러: ${error.message}</div>`;
      }
    }

    // ========================================
    // 🎨 결과 화면 표시
    // ========================================
    function displayResults() {
      const resultsDiv = document.getElementById('results');

      if (generatedPosts.length === 0) {
        resultsDiv.innerHTML = '<p>생성된 글이 없습니다.</p>';
        return;
      }

      const html = generatedPosts.map((post, index) => `
        <div class="result-item">
          <h3>키워드: ${post.keyword}</h3>

          <div style="margin: 15px 0;">
            <strong>제목:</strong>
            <div style="background: white; padding: 10px; border-radius: 5px; margin-top: 5px;">
              ${post.title}
            </div>
            <button onclick="copyTitle(${index})">제목 복사</button>
          </div>

          <div style="margin: 15px 0;">
            <strong>본문:</strong>
            <div class="result-body" style="background: white; padding: 15px; border-radius: 5px; margin-top: 5px;">
              ${post.body}
            </div>
            <button onclick="copyBody(${index})">본문 복사</button>
          </div>

          <div style="margin: 15px 0;">
            <strong>해시태그:</strong>
            <div style="background: white; padding: 10px; border-radius: 5px; margin-top: 5px;">
              ${post.hashtags.map(tag => '#' + tag).join(' ')}
            </div>
            <button onclick="copyTags(${index})">태그 복사</button>
          </div>
        </div>
      `).join('');

      resultsDiv.innerHTML = html;
    }

    // ========================================
    // 📋 복사 함수들
    // ========================================

    async function copyTitle(index) {
      const post = generatedPosts[index];

      try {
        await navigator.clipboard.writeText(post.title);
        alert('✅ 제목이 복사되었습니다!');
      } catch (err) {
        alert('❌ 복사 실패: ' + err.message);
      }
    }

    async function copyBody(index) {
      const post = generatedPosts[index];

      try {
        // **별표** → <strong>굵게</strong>
        let htmlBody = post.body.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        // 줄바꿈 → <br>
        htmlBody = htmlBody.replace(/\n/g, '<br>');

        // HTML과 일반 텍스트 둘 다 클립보드에 복사
        const htmlBlob = new Blob([htmlBody], { type: 'text/html' });
        const textBlob = new Blob([post.body], { type: 'text/plain' });

        const clipboardItem = new ClipboardItem({
          'text/html': htmlBlob,
          'text/plain': textBlob
        });

        await navigator.clipboard.write([clipboardItem]);
        alert('✅ 본문이 복사되었습니다! (서식 포함)');
      } catch (err) {
        // ClipboardItem을 지원하지 않는 브라우저는 일반 텍스트만 복사
        try {
          await navigator.clipboard.writeText(post.body);
          alert('✅ 본문이 복사되었습니다! (일반 텍스트)');
        } catch (err2) {
          alert('❌ 복사 실패: ' + err2.message);
        }
      }
    }

    async function copyTags(index) {
      const post = generatedPosts[index];

      try {
        const tagsText = post.hashtags.map(tag => '#' + tag).join(' ');
        await navigator.clipboard.writeText(tagsText);
        alert('✅ 태그가 복사되었습니다!');
      } catch (err) {
        alert('❌ 복사 실패: ' + err.message);
      }
    }

    // ========================================
    // ✏️ 스타일 수정 저장 함수
    // ========================================
    function updateStyle() {
      try {
        // 입력 필드에서 수정된 값 읽기
        const tone = document.getElementById('styleTone')?.value || '';
        const subheadings = document.getElementById('styleSubheadings')?.value || '';
        const paragraphLength = document.getElementById('styleParagraphLength')?.value || '';
        const hashtagCount = document.getElementById('styleHashtagCount')?.value || '';
        const introFormula = document.getElementById('styleIntroFormula')?.value || '';
        const closingFormula = document.getElementById('styleClosingFormula')?.value || '';

        // analyzedStyle 업데이트
        analyzedStyle = {
          tone: tone,
          subheadings: subheadings,
          paragraphLength: paragraphLength,
          hashtagCount: hashtagCount,
          introFormula: introFormula,
          closingFormula: closingFormula
        };

        // localStorage에 저장
        localStorage.setItem('analyzedStyle', JSON.stringify(analyzedStyle));
        console.log('✅ 스타일 자동 저장 완료:', analyzedStyle);

      } catch (err) {
        console.error('스타일 저장 에러:', err);
      }
    }

    // ========================================
    // 🎧 스타일 입력 필드에 자동 저장 이벤트 리스너 추가
    // ========================================
    function attachStyleInputListeners() {
      const styleInputIds = [
        'styleTone',
        'styleSubheadings',
        'styleParagraphLength',
        'styleHashtagCount',
        'styleIntroFormula',
        'styleClosingFormula'
      ];

      styleInputIds.forEach(id => {
        const element = document.getElementById(id);
        if (element) {
          // input 이벤트: 타이핑할 때마다 저장
          element.addEventListener('input', updateStyle);
          // blur 이벤트: 포커스를 잃을 때도 저장
          element.addEventListener('blur', updateStyle);
        }
      });

      console.log('✅ 스타일 입력 필드 자동 저장 활성화');
    }

    // ========================================
    // 💾 localStorage 저장/불러오기
    // ========================================

    function saveToStorage() {
      try {
        // 참고 글
        const referencePosts = document.getElementById('referencePosts').value;
        if (referencePosts) {
          localStorage.setItem('referencePosts', referencePosts);
        }

        // 가게 정보
        const storeData = {
          name: document.getElementById('storeName').value,
          type: document.getElementById('storeType').value,
          location: document.getElementById('storeLocation').value,
          highlights: document.getElementById('storeHighlights').value
        };
        localStorage.setItem('storeInfo', JSON.stringify(storeData));

        // 키워드
        const keywords = document.getElementById('keywords').value;
        if (keywords) {
          localStorage.setItem('keywords', keywords);
        }

        console.log('✅ 로컬 저장 완료');
      } catch (err) {
        console.error('저장 실패:', err);
      }
    }

    function loadFromStorage() {
      try {
        // 참고 글 불러오기
        const referencePosts = localStorage.getItem('referencePosts');
        if (referencePosts) {
          document.getElementById('referencePosts').value = referencePosts;
        }

        // 가게 정보 불러오기
        const storeData = localStorage.getItem('storeInfo');
        if (storeData) {
          const store = JSON.parse(storeData);
          document.getElementById('storeName').value = store.name || '';
          document.getElementById('storeType').value = store.type || '';
          document.getElementById('storeLocation').value = store.location || '';
          document.getElementById('storeHighlights').value = store.highlights || '';
        }

        // 키워드 불러오기
        const keywords = localStorage.getItem('keywords');
        if (keywords) {
          document.getElementById('keywords').value = keywords;
        }

        // 스타일 분석 결과 불러오기
        const styleData = localStorage.getItem('analyzedStyle');
        if (styleData) {
          analyzedStyle = JSON.parse(styleData);
          const resultDiv = document.getElementById('styleResult');
          resultDiv.innerHTML = `
            <div class="result-item">
              <h3 style="text-align: center; margin-bottom: 20px; font-size: 1.4em;">저장된 스타일 분석</h3>

              <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">말투</label>
                <input type="text" id="styleTone" value="${analyzedStyle.tone}" placeholder="예: 해요체 - '~해요', '~이에요' 사용">
              </div>

              <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">소제목</label>
                <input type="text" id="styleSubheadings" value="${analyzedStyle.subheadings}" placeholder="예: 3~4개 사용, 이모지 배치">
              </div>

              <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">문단 길이</label>
                <input type="text" id="styleParagraphLength" value="${analyzedStyle.paragraphLength}" placeholder="예: 짧음 - 문단당 2~3문장">
              </div>

              <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">해시태그 개수</label>
                <input type="text" id="styleHashtagCount" value="${analyzedStyle.hashtagCount}" placeholder="예: 5~7개">
              </div>

              <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">도입부 패턴</label>
                <textarea id="styleIntroFormula" style="min-height: 80px;" placeholder="예: 질문으로 시작 - '혹시 ~하신 적 있나요?'">${analyzedStyle.introFormula}</textarea>
              </div>

              <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #4A90B5;">마무리 패턴</label>
                <textarea id="styleClosingFormula" style="min-height: 80px;" placeholder="예: 방문 유도 - '한번 방문해보세요!'">${analyzedStyle.closingFormula}</textarea>
              </div>
            </div>
          `;

          // 입력 필드에 자동 저장 이벤트 리스너 추가
          attachStyleInputListeners();
        }

        // 생성된 글 불러오기
        const postsData = localStorage.getItem('generatedPosts');
        if (postsData) {
          generatedPosts = JSON.parse(postsData);
          displayResults();
        }

        console.log('✅ 로컬 데이터 불러오기 완료');
      } catch (err) {
        console.error('불러오기 실패:', err);
      }
    }

    // 페이지 로드 시
    window.addEventListener('load', () => {
      loadFromStorage();
      console.log('✅ 페이지 로드 완료! 저장된 데이터를 불러왔습니다.');

      // 입력 필드 변경 시 자동 저장
      const inputs = ['referencePosts', 'storeName', 'storeType', 'storeLocation', 'storeHighlights', 'keywords'];
      inputs.forEach(id => {
        const element = document.getElementById(id);
        if (element) {
          element.addEventListener('input', saveToStorage);
        }
      });
    });

  </script>
</body>
</html>
